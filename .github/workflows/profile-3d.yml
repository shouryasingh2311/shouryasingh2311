name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # Runs daily at 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          sed -i 's/fill: #00000f;/fill: transparent;/g' profile-3d-contrib/*.svg
          sed -i 's/stroke: #00000f;/stroke: transparent;/g' profile-3d-contrib/*.svg
          git add -A .
          if git commit -m "chore: update 3d contribution graph"; then
            git push
          fi
